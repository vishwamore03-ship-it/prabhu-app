          package com.prabhu.divyadarshan.reminder

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import com.prabhu.divyadarshan.MainActivity
          import com.prabhu.divyadarshan.R
          import java.util.Calendar

          object ReminderScheduler {
              private fun pi(ctx: Context) = PendingIntent.getBroadcast(
                  ctx, 1, Intent(ctx, ReminderReceiver::class.java),
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )

              /** Inexact daily alarm: needs no special exact-alarm permission. */
              fun schedule(ctx: Context, hour: Int, minute: Int) {
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, hour); set(Calendar.MINUTE, minute); set(Calendar.SECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, cal.timeInMillis, AlarmManager.INTERVAL_DAY, pi(ctx))
              }

              fun cancel(ctx: Context) {
                  (ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager).cancel(pi(ctx))
              }
          }

          class ReminderReceiver : BroadcastReceiver() {
              @SuppressLint("MissingPermission")
              override fun onReceive(c: Context, i: Intent?) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      c.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  val ch = "daily_pooja"
                  c.getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(ch, "Daily Pooja", NotificationManager.IMPORTANCE_DEFAULT))
                  val hi = c.getSharedPreferences("prefs", Context.MODE_PRIVATE).getString("lang", "MR") == "HI"
                  val open = PendingIntent.getActivity(
                      c, 0, Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = NotificationCompat.Builder(c, ch)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("PRABHU DIVYA DARSHAN")
                      .setContentText(if (hi) "पूजा का समय हो गया है 🙏" else "पूजेची वेळ झाली आहे 🙏")
                      .setContentIntent(open).setAutoCancel(true).build()
                  NotificationManagerCompat.from(c).notify(1, n)
              }
          }
