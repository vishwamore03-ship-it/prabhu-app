          import java.time.LocalDate

          private data class Quick(val emoji: String, val label: Bi, val route: String)

          @Composable
          fun HomeScreen(go: (String) -> Unit) {
              val lang = LocalLang.current
              val today = remember { LocalDate.now() }
              val msg = Content.dailyMessages[today.dayOfYear % Content.dailyMessages.size]
              val weekday = Content.weekdays[today.dayOfWeek.value - 1].get(lang)
              val dateText = "$weekday, ${today.dayOfMonth} ${Content.months[today.monthValue - 1].get(lang)} ${today.year}"
              val quick = listOf(
                  Quick("🪔", Bi("दैनिक पूजा"), "pooja/ganpati"), Quick("🔔", Bi("आरती"), "library/aarti"),
                  Quick("🎉", Bi("सण", "त्योहार"), "festivals"), Quick("📅", Bi("पंचांग"), "panchang"),
                  Quick("🕉", Bi("मंत्र"), "library/mantra"), Quick("♈", Bi("राशीभविष्य", "राशिफल"), "horoscope")
              )
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Column(
                      Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(Maroon, Color(0xFF9A3412)))).padding(20.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("ॐ", fontSize = 44.sp, color = Gold)
                      Text("PRABHU DIVYA DARSHAN", color = Gold, fontFamily = FontFamily.Serif, fontWeight = FontWeight.Bold, fontSize = 20.sp, textAlign = TextAlign.Center)
                      Text(tr("ऑनलाइन पूजा", "ऑनलाइन पूजा"), color = Cream)
                      Spacer(Modifier.height(10.dp))
                      Text("📅 $dateText", color = Cream, fontWeight = FontWeight.Medium)
                      Spacer(Modifier.height(12.dp))
                      Card(colors = CardDefaults.cardColors(containerColor = Cream), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(14.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(tr("आजचा भक्तिसंदेश", "आज का भक्ति संदेश"), color = Saffron, fontWeight = FontWeight.Bold)
                              Text(msg.t(), textAlign = TextAlign.Center, color = Maroon, fontFamily = FontFamily.Serif, fontSize = 17.sp)
                          }
                      }
                  }
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text(tr("झटपट प्रवेश", "त्वरित पहुँच"), style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = Maroon)
                      Grid(quick, 3) { q ->
                          Card(onClick = { go(q.route) }, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color.White),
                              border = BorderStroke(1.dp, Gold), modifier = Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(vertical = 12.dp).fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(q.emoji, fontSize = 28.sp)
                                  Text(q.label.t(), fontSize = 13.sp, textAlign = TextAlign.Center, color = Maroon, fontWeight = FontWeight.Medium)
                              }
                          }
