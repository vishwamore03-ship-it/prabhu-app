          package com.prabhu.divyadarshan.audio

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.SoundPool
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import com.prabhu.divyadarshan.R

          /** Bell + conch via SoundPool; looping ambient tone via MediaPlayer. All assets are synthesized originals. */
          class AudioController(private val ctx: Context) {
              private val pool = SoundPool.Builder().setMaxStreams(4).setAudioAttributes(
                  AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
              ).build()
              private val bell = pool.load(ctx, R.raw.bell, 1)
              private val conch = pool.load(ctx, R.raw.conch, 1)
              private var player: MediaPlayer? = null

              var volume by mutableFloatStateOf(0.7f)
                  private set
              var playing by mutableStateOf(false)
                  private set

              fun ring() { pool.play(bell, volume, volume, 1, 0, 1f) }
              fun blow() { pool.play(conch, volume, volume, 1, 0, 1f) }

              private fun ensure(): MediaPlayer? = player ?: MediaPlayer.create(ctx, R.raw.ambient)?.also {
                  it.isLooping = true
                  it.setVolume(volume, volume)
                  player = it
              }

              fun play() { ensure()?.start(); playing = true }
              fun pause() { player?.pause(); playing = false }
              fun replay() { ensure()?.let { it.seekTo(0); it.start() }; playing = true }
              fun setVol(v: Float) { volume = v; player?.setVolume(v, v) }

              fun release() {
                  pool.release(); player?.release(); player = null; playing = false
              }
          }
