          import wave, math, struct
          SR=22050
          def save(name, data):
              m=max(abs(x) for x in data) or 1
              with wave.open(f"app/src/main/res/raw/{name}.wav","wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  w.writeframes(b"".join(struct.pack("<h",int(x/m*0.8*32767)) for x in data))
          N=int(SR*3.5); d=[]
