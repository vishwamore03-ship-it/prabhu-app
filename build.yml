          package com.prabhu.divyadarshan.data

          import android.app.Application
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import com.prabhu.divyadarshan.reminder.ReminderScheduler

          /** Local-only preferences (no login, no backend). */
          class AppViewModel(app: Application) : AndroidViewModel(app) {
              private val sp = app.getSharedPreferences("prefs", Context.MODE_PRIVATE)

              var lang by mutableStateOf(runCatching { Lang.valueOf(sp.getString("lang", "MR")!!) }.getOrDefault(Lang.MR))
                  private set
              var fontScale by mutableFloatStateOf(sp.getFloat("fs", 1f))
                  private set
              var favorites by mutableStateOf(sp.getStringSet("fav", emptySet())?.toSet() ?: emptySet())
                  private set
              var remindOn by mutableStateOf(sp.getBoolean("rOn", false))
                  private set
              var remindHour by mutableIntStateOf(sp.getInt("rH", 6))
                  private set
              var remindMinute by mutableIntStateOf(sp.getInt("rM", 0))
                  private set
              var city by mutableStateOf(sp.getString("city", "Pune") ?: "Pune")
                  private set

              init { if (remindOn) ReminderScheduler.schedule(app, remindHour, remindMinute) }

              fun setLang(l: Lang) { lang = l; sp.edit().putString("lang", l.name).apply() }
              fun setFontScale(s: Float) { fontScale = s; sp.edit().putFloat("fs", s).apply() }
              fun setCity(c: String) { city = c; sp.edit().putString("city", c).apply() }

              fun toggleFavorite(id: String) {
                  favorites = if (id in favorites) favorites - id else favorites + id
                  sp.edit().putStringSet("fav", favorites).apply()
              }

              fun setReminder(on: Boolean, h: Int, m: Int) {
                  remindOn = on; remindHour = h; remindMinute = m
                  sp.edit().putBoolean("rOn", on).putInt("rH", h).putInt("rM", m).apply()
                  val app = getApplication<Application>()
                  if (on) ReminderScheduler.schedule(app, h, m) else ReminderScheduler.cancel(app)
              }
          }
